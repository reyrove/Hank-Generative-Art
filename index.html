<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hank</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: #0a0a0a;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    canvas.hidden {
      display: none;
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE -->
  <div class="title-bar">
    <div class="title"><span class="accent">Hank</span></div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="artCanvas"></canvas>
    <img id="shirt-mockup" src="Hank.jpg" alt="Hank on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">palette</span>
        <span class="value" id="paletteDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">drift</span>
        <span class="value" id="driftDisplay">∞</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">generative drift</span>
      <span class="sep">·</span>
      <span class="highlight">color oscillation</span>
      <span class="sep">·</span>
      <span class="highlight">infinite motion</span>
    </div>

  </div>

</div>

<script>
// ============================================
// HANK — GENERATIVE ELLIPSE DRIFT
// ============================================

(function() {
  const canvas = document.getElementById('artCanvas');
  const ctx = canvas.getContext('2d');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');

  // ---- color palette ----
  const Backgroundcolors = [
    '#34282C','#3B3131','#0C090A','#36454F','#151B54','#045F5F','#045D5D','#033E3E','#25383C','#2C3539',
    '#1F6357','#555D50','#254117','#004225','#665D1E','#483C32','#4A412A','#473810','#493D26','#513B1C',
    '#3D3635','#3B2F2F','#43302E','#622F22','#5C3317','#7E3517','#800000','#660000','#551606','#3F000F',
    '#3D0C02','#2F0909','#2B1B17','#550A35','#614051','#583759','#4E5180','#483D8B','#4B0150','#36013F',
    '#2E1A47','#736F6E','#888B90','#99A3A3','#B6B6B4','#C9C1C1','#D1D0CE','#DADBDD','#F5F5F5','#BCC6CC',
    '#98AFC7','#728FCE','#2916F5','#1974D2','#1589FF','#14A3C7','#659EC7','#87AFC7','#95B9C7','#3BB9FF',
    '#79BAEC','#A0CFEC','#B4CFEC','#C2DFFF','#AFDCEC','#C9DFEC','#EBF4FA','#F0FFFF','#CCFFFF','#9AFEFF',
    '#57FEFF','#4EE2EC','#8EEBEC','#CFECEC','#B3D9D9','#81D8D0','#7BCCB5','#66CDAA','#93E9BE','#AAF0D1',
    '#01F9C6','#40E0D0','#46C7C7','#20B2AA','#00A36C','#3EB489','#50C878','#7C9D8E','#78866B','#728C00',
    '#6B8E23','#808000','#08A04B','#6AA121','#8A9A5B','#4AA02C','#12AD2B','#73A16C','#6CBB3C','#4CC417',
    '#54C571','#89C35C','#99C68E','#A0D6B4','#8FBC8F','#829F82','#A2AD9C','#B8BC86','#9CB071','#8FB31D',
    '#B0BF1A','#77DD77','#5EFB6E','#00FA9A','#12E193','#00FF00','#ADF802','#DAEE01','#CCFB5D','#90EE90',
    '#E3F9A6','#DBF9DB','#E8F1D4','#F5FFFA','#FFFFC2','#FFFDD0','#F5F5DC','#FFF8DC','#F7E7CE','#F5DEB3',
    '#FED8B1','#FBD5AB','#FBE7A1','#E8E4C9','#F0E68C','#FFE87C','#FFFF33','#F5E216','#FFCE44','#FBB917',
    '#FBB117','#FFA500','#EE9A4D','#E2A76F','#C19A6B','#E6BF83','#C2B280','#C8B560','#C7A317','#E1AD01',
    '#CD853F','#CA762B','#B87333','#966F33','#806517','#8E7618','#8A865D','#93917C','#AF9B60','#A0522D',
    '#B83C08','#EB5406','#C36241','#E56717','#FF5F1F','#FF7F50','#FF8674','#F75D59','#FD1C03','#E41B17',
    '#7F525D','#FA2A55','#DA70D6','#5865F2','#C8C4DF'
  ];

  const BackgroundcolorsName = [
    'Charcoal','Oil','Night','Charcoal Blue','Night Blue','Medium Teal','Dark Teal','Deep Teal','DarkSlateGray',
    'Gunmetal','Dark Green Blue','Ebony','Dark Forest Green','Lotus Green','Antique Bronze','Taupe',
    'Dark Grayish Olive','Dark Hazel Brown','Mocha','Milk Chocolate','Gray Brown','Dark Coffee',
    'Old Burgundy','Red Brown','Bakers Brown','Blood Red','Maroon','Red Blood','Blood Night','Chocolate Brown',
    'Black Bean','Dark Maroon','Midnight','Purple Lily','Eggplant','Plum Purple','Purple Navy','DarkSlateBlue',
    'Dark Purple','Deep Purple','Midnight Purple','Alien Gray','Sheet Metal','Stainless Steel Gray','Gray Cloud',
    'Steampunk','Gray Goose','Silver White','WhiteSmoke','Metallic Silver','Blue Gray','Light Purple Blue',
    'Canary Blue','Bright Navy Blue','Neon Blue','Cyan Blue','Blue Koi','Columbia Blue','Baby Blue','Midday Blue',
    'Denim Blue','Jeans Blue','Pastel Blue','Sea Blue','Coral Blue','Gulf Blue','Water','Azure','Light Slate',
    'Electric Blue','Blue Zircon','Blue Diamond','Blue Lagoon','Pale Blue Lily','Light Teal','Tiffany Blue',
    'Blue Green','MediumAquaMarine','Aqua Seafoam Green','Magic Mint','Bright Teal','Turquoise','Jellyfish',
    'LightSeaGreen','Jade','Mint','Emerald','Metallic Green','Camouflage Green','Venom Green','OliveDrab','Olive',
    'Irish Green','Green Onion','Moss Green','Green Pepper','Parrot Green','Dinosaur Green','Green Snake',
    'Green Apple','Zombie Green','Green Peas','Frog Green','Turquoise Green','DarkSeaGreen','Basil Green',
    'Gray Green','Light Olive Green','Iguana Green','Citron Green','Acid Green','Pastel Green','Jade Green',
    'MediumSpringGreen','Aqua Green','Lime','Lemon Green','Neon Yellow Green','Tea Green','LightGreen',
    'Organic Brown','Light Rose Green','Chrome White','MintCream','Parchment','Cream White','Beige','Cornsilk',
    'Champagne','Wheat','Light Orange','Coral Peach','Golden Blonde','Dirty White','Khaki','Sun Yellow','Neon Yellow',
    'Banana Yellow','Chrome Gold','Saffron','Beer','Orange','Brown Sand','Brown Sugar','Camel Brown','Deer Brown',
    'Sand','Fall Leaf Brown','Cookie Brown','Mustard','Peru','Pumpkin Pie','Copper','Wood','Oak Brown','Hazel',
    'Khaki Green','Millennium Jade','Bullet Shell','Sienna','Ginger Red','Red Gold','Rust','Papaya Orange',
    'Bright Orange','Coral','Salmon Pink','Bean Red','Neon Red','Love Red','Dull Purple','Red Pink','Orchid',
    'Blurple','Viola'
  ];

  // ---- state ----
  let size = 600;
  let w, h, x, y, theta, dth, rgbRange;
  let minRangeW, maxRangeW, minRangeH, maxRangeH;
  let r, g, b;
  let deltaStartX, deltaStartY, deltaEndW, deltaEndH;
  let bg1, bg2, name1, name2;
  let frameCount = 0;
  let animationId = null;
  let running = true;
  let showingShirt = false;
  let isFirstLoad = true;

  // ---- helpers ----
  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function drawDiagonalGradient(c1, c2) {
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
  }

  // ---- init ----
  function initArt() {
    const idx1 = Math.floor(Math.random() * Backgroundcolors.length);
    const idx2 = Math.floor(Math.random() * Backgroundcolors.length);
    bg1 = Backgroundcolors[idx1];
    bg2 = Backgroundcolors[idx2];
    name1 = BackgroundcolorsName[idx1];
    name2 = BackgroundcolorsName[idx2];

    drawDiagonalGradient(bg1, bg2);

    w = size / 2;
    h = size / 2;
    x = size / 2;
    y = size / 2;

    const range = size / 200;
    deltaStartX = rand(-range, range);
    deltaStartY = rand(-range, range);
    deltaEndW = rand(-range, range);
    deltaEndH = rand(-range, range);

    theta = rand(0, Math.PI);
    dth = rand(0, 0.05);
    rgbRange = rand(5, 20);

    minRangeW = rand(0, size/2);
    maxRangeW = rand(minRangeW, size);
    minRangeH = rand(0, size/2);
    maxRangeH = rand(minRangeH, size);

    r = rand(0, 255);
    g = rand(0, 255);
    b = rand(0, 255);

    frameCount = 0;
    
    updateUI();
  }

  // ---- draw frame ----
  function drawFrame() {
    if (!running || showingShirt) return;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(theta);

    const sw = rand(size/2000, size/1000);
    ctx.lineWidth = sw;
    ctx.strokeStyle = `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
    ctx.fillStyle = 'transparent';

    ctx.beginPath();
    ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    r += rand(-rgbRange, rgbRange);
    g += rand(-rgbRange, rgbRange);
    b += rand(-rgbRange, rgbRange);
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));

    x += deltaStartX;
    y += deltaStartY;
    w += deltaEndW;
    h += deltaEndH;

    const diagonal = Math.sqrt(Math.pow(w/2, 2) + Math.pow(h/2, 2));
    if (x - diagonal <= 0 || x + diagonal >= size) {
      deltaStartX *= -1;
      x = Math.min(size - diagonal, Math.max(diagonal, x));
    }
    if (y - diagonal <= 0 || y + diagonal >= size) {
      deltaStartY *= -1;
      y = Math.min(size - diagonal, Math.max(diagonal, y));
    }

    if (w < minRangeW || w > maxRangeW) {
      deltaEndW *= -1;
    }
    if (h < minRangeH || h > maxRangeH) {
      deltaEndH *= -1;
    }

    theta += Math.random() * dth;

    frameCount++;
    animationId = requestAnimationFrame(drawFrame);
  }

  // ---- UI update ----
  function updateUI() {
    document.getElementById('paletteDisplay').textContent = name1 + ' → ' + name2;
    document.getElementById('driftDisplay').textContent = '∞';
  }

  // ---- regenerate ----
  function regenerate() {
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    running = true;
    if (showingShirt) {
      toggleShirt();
    }
    initArt();
    animationId = requestAnimationFrame(drawFrame);
  }

  // ---- toggle shirt ----
  function toggleShirt() {
    showingShirt = !showingShirt;
    
    if (showingShirt) {
      canvas.classList.add('hidden');
      shirtMockup.classList.add('active');
      shirtToggle.classList.add('active');
      shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
      running = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      // Use the Hank.jpg image (already loaded)
      // If it fails to load, fallback to canvas capture
      if (!shirtMockup.complete || shirtMockup.naturalHeight === 0) {
        // Fallback: capture canvas
        const dataUrl = canvas.toDataURL('image/png');
        shirtMockup.src = dataUrl;
      }
    } else {
      canvas.classList.remove('hidden');
      shirtMockup.classList.remove('active');
      shirtToggle.classList.remove('active');
      shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
      running = true;
      // Restore the original image source if it was overwritten
      if (shirtMockup.src !== 'Hank.jpg') {
        shirtMockup.src = 'Hank.jpg';
      }
      animationId = requestAnimationFrame(drawFrame);
    }
  }

  // ---- save PNG ----
  function savePNG() {
    const link = document.createElement('a');
    if (showingShirt) {
      link.download = `Hank_Shirt_${Date.now()}.png`;
      link.href = shirtMockup.src;
    } else {
      link.download = `Hank_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
    }
    link.click();
  }

  // ---- layout canvas ----
  function layoutCanvas() {
    const container = document.getElementById('canvas-container');
    const containerRect = container.getBoundingClientRect();
    let maxWidth = containerRect.width;
    let maxHeight = containerRect.height;
    
    maxWidth = Math.max(maxWidth, 80);
    maxHeight = Math.max(maxHeight, 80);
    
    let cWidth = maxWidth;
    let cHeight = cWidth;
    
    if (cHeight > maxHeight) {
      cHeight = maxHeight;
      cWidth = maxHeight;
    }
    
    cWidth = Math.max(cWidth, 80);
    cHeight = Math.max(cHeight, 80);
    
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    
    let targetWidth = cWidth * dpr;
    let targetHeight = cHeight * dpr;
    
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    canvas.style.width = cWidth + 'px';
    canvas.style.height = cHeight + 'px';
    
    shirtMockup.style.width = cWidth + 'px';
    shirtMockup.style.height = cHeight + 'px';
    
    size = Math.min(targetWidth, targetHeight);
    
    if (animationId) {
      cancelAnimationFrame(animationId);
    }
    
    if (!showingShirt) {
      initArt();
      running = true;
      animationId = requestAnimationFrame(drawFrame);
    }
  }

  // ---- resize handler ----
  let resizeTmr = null;
  function handleResize() {
    clearTimeout(resizeTmr);
    resizeTmr = setTimeout(() => {
      layoutCanvas();
    }, 100);
  }

  // ---- keyboard ----
  document.addEventListener('keydown', function(e) {
    if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      savePNG();
    }
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      regenerate();
    }
    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      toggleShirt();
    }
  });

  // ---- controls ----
  document.getElementById('controlsBar').addEventListener('click', regenerate);
  document.getElementById('controlsBar').addEventListener('touchend', function(e) {
    e.preventDefault();
    regenerate();
  });

  document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
  document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
    e.preventDefault();
    toggleShirt();
  });

  // ---- window ----
  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', function() {
    setTimeout(handleResize, 400);
  });

  // ---- visibility ----
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && running && !showingShirt) {
      drawFrame();
    }
  });

  // ---- start ----
  function init() {
    layoutCanvas();
    console.log('✨ Hank · press [s] to save · [r] to regenerate · [t] toggle apparel');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Expose
  window.regenerate = regenerate;
  window.savePNG = savePNG;
  window.toggleShirt = toggleShirt;
  window.layoutCanvas = layoutCanvas;

})();
</script>
</body>
</html>
